<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dirección Centro - Registro de Voces</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 12px; background-color: #f4f7f6; color: #333; }
    .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 6px solid #00a896; }
    h2, h3 { text-align: center; color: #2c3e50; margin-top: 5px; }
    .card-eter { background: #fdfdfd; border: 1px solid #e0f2f1; padding: 15px; border-radius: 8px; margin-bottom: 12px; }
    .titulo-card { font-size: 14px; font-weight: bold; color: #00a896; margin-bottom: 10px; border-bottom: 1px dashed #00a896; padding-bottom: 4px; }
    label { display: block; margin: 10px 0 4px; font-size: 13px; font-weight: 600; color: #4a5568; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 14px; margin-bottom: 5px; }
    textarea { height: 60px; resize: none; }
    button.save-btn { width: 100%; padding: 12px; background-color: #00a896; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    #status-box { text-align: center; padding: 10px; border-radius: 6px; font-weight: bold; display: none; margin-bottom: 12px; }
    .ok { background-color: #e0f2f1; color: #004d40; }
    
    .secret-trigger { width: 40px; height: 40px; margin: 25px auto 0; cursor: pointer; opacity: 0.15; transition: opacity 0.2s; font-size: 20px; text-align: center; }
    .secret-trigger:hover { opacity: 0.6; }
    .panel-encargada { display: none; margin-top: 20px; border-top: 2px dashed #00a896; padding-top: 15px; }
    
    .rezador-row { background: #f9fbfb; border: 1px solid #cbd5e0; border-left: 5px solid #00a896; padding: 12px; border-radius: 6px; margin-bottom: 10px; text-align: left; font-size: 13px; }
    button.wa-send-btn { background-color: #0288d1; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; box-sizing: border-box; }
  </style>
</head>
<body>

  <div class="container">
    <h2>🌀 Dirección del Centro (Éter)</h2>
    <div id="status-box"></div>

    <!-- PANTALLA PÚBLICA DE INSCRIPCIÓN -->
    <div id="pantalla-inscripcion">
      <h3>Inscripción de Voces - Coro Jeyajé</h3>
      <p style="font-size:12px; color:#7f8c8d; text-align:center; margin-top:-8px;">Suma tu canto y medicina al círculo armónico de la Tribu.</p>
      
      <div class="card-eter">
        <div class="titulo-card">👤 Ficha de Identidad</div>
        <label>Nombre Completo:</label>
        <input type="text" id="nombreRezador" placeholder="Ej. Ana María Claros">
        <label>Número de WhatsApp:</label>
        <input type="text" id="telefono" placeholder="Ej. 59170000000">
      </div>

      <div class="card-eter">
        <div class="titulo-card">🎵 Relación con la Tribu</div>
        <label>Condición en el Coro:</label>
        <!-- ASÍ DEBE QUEDAR LA LÍNEA 58 CORRECTA Y LIMPIA EN TU VS CODE -->
        <select id="tipoParticipante" onchange="document.getElementById('invitado-row').style.display=this.value==='Invitado Nuevo'?'block':'none'">

          <option value="Miembro de la Comunidad">Miembro de la Comunidad</option>
          <option value="Invitado Nuevo">Invitado Nuevo (Primera vez)</option>
        </select>
        <div id="invitado-row" style="display:none; margin-top:10px;">
          <label>¿Invitado por quién? (Contacto en la Tribu):</label>
          <input type="text" id="invitadoPor" placeholder="Ej. Sostenido por Guardián del Este">
        </div>
      </div>

      <div class="card-eter">
        <div class="titulo-card">✨ Observaciones</div>
        <label>Notas Especiales (Instrumentos o Apoyo):</label>
        <textarea id="notas" placeholder="Ej. Toca sonajas. Requiere apoyo con las letras..."></textarea>
      </div>

      <button class="save-btn" onclick="guardarInscripcionPublica()">Enviar Mi Inscripción al Coro 🌀</button>
    </div>

    <!-- BOTÓN OCULTO DE ENGRANAJE EXCLUSIVO PARA LA ENCARGADA -->
    <div class="secret-trigger" onclick="abrirConsolaEncargada()">⚙️</div>

    <!-- PANTALLA PRIVADA ADMINISTRATIVA DE LA ENCARGADA -->
    <div id="sec-admin-coro" class="panel-encargada">
      <h3>🦅 Consola Administrativa del Coro</h3>
      <button class="save-btn" style="background-color:#2c3e50; margin-bottom:15px;" onclick="cargarRezadoresInscritos()">🔄 Actualizar Lista de Espera</button>
      <div id="listado-rezadores-vivos"></div>
    </div>
  </div>

  <script>
    // URL PROVISTA POR TU CUENTA DE GOOGLE APPS SCRIPT DE LA DIRECCIÓN CENTRO
    const WEB_APP_URL_CENTRO = "https://script.google.com/macros/s/AKfycbyk3l019AeTbFSQSCL6gu4t-sxI6D1elGKgAuPxzF_tBBomusRu-Jq0Cxb_CdvEPzkJXA/exec";
    
    var globalRegistros = [];
    var pAsistente = "";
    var pStaff = "";

    function avisarEstado(txt) {
      var box = document.getElementById("status-box");
      box.innerText = txt; box.className = "ok"; box.style.display = "block";
      window.scrollTo(0,0);
    }

    // 1. ENVÍO DESDE LA PANTALLA GENERAL LIBRE (COMUNIDAD) - PROTOCOLO ANTI-CORS BLINDADO
    function guardarInscripcionPublica() {
      var nombreTxt = document.getElementById("nombreRezador").value;
      var telfTxt = document.getElementById("telefono").value;
      if (!nombreTxt.trim()) { alert("Por favor ingresa tu nombre."); return; }
      
      avisarEstado("Sincronizando con el Altar del Centro...");

      var datos = {
        tipo: document.getElementById("tipoParticipante").value,
        n: nombreTxt,
        w: telfTxt,
        cat: document.getElementById("invitadoPor").value || "-",
        e: document.getElementById("notas").value || "-",
        i: "-"
      };

      fetch(WEB_APP_URL_CENTRO, {
        method: "POST",
        mode: "no-cors",
        redirect: "follow",
        cache: "no-cache",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(datos)
      })
      .then(function() {
        avisarEstado("🌀 ¡Inscripción enviada al Altar con éxito! La Encargada del Coro validará tu registro y te contactará.");
        document.getElementById("nombreRezador").value = "";
        document.getElementById("telefono").value = "";
        document.getElementById("invitadoPor").value = "";
        document.getElementById("notas").value = "";
      })
      .catch(function(err) {
        avisarEstado("⚠️ Revisando conexión con el Altar: " + err.toString());
      });
    }

    function abrirConsolaEncargada() {
      var clave = prompt("Introduce la clave de la Encargada del Centro:");
      if (clave === "Eter2026" || clave === "2009") { 
        document.getElementById("sec-admin-coro").style.display = "block";
        cargarRezadoresInscritos();
      } else if (clave !== null) {
        alert("❌ Clave incorrecta.");
      }
    }

    function cargarRezadoresInscritos() {
      var listaBox = document.getElementById("listado-rezadores-vivos");
      listaBox.innerHTML = "<p style='font-size:12px; color:#7f8c8d;'>Leyendo el registro oficial de voces...</p>";
      
      fetch(WEB_APP_URL_CENTRO)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          globalRegistros = data.registros || [];
          pAsistente = data.plantillaAsistente || "";
          pStaff = data.plantillaStaff || "";
          
          if (!globalRegistros || globalRegistros.length === 0) {
            listaBox.innerHTML = "<p style='font-size:12px; color:#7f8c8d;'>No hay voces registradas en esta luna.</p>";
            return;
          }
          
          listaBox.innerHTML = "";
          
          for (var i = 0; i < globalRegistros.length; i++) {
            var r = globalRegistros[i];
            var div = document.createElement("div");
            div.className = "rezador-row";
            
            div.innerHTML = "<b>👤 Rezador:</b> " + r.n + "<br>" +
                            "<b>📱 Teléfono:</b> " + r.w + "<br>" +
                            "<b>✨ Condición:</b> " + r.tipo + (r.cat !== "-" ? " (Por: " + r.cat + ")" : "") + "<br>" +
                            "<b>📝 Notas:</b> " + r.e + "<br>" +
                            "<button class='wa-send-btn' onclick='dispararWhatsAppClonado(" + i + ")'>📲 Enviar Confirmación e Indicaciones</button>";
            
            listaBox.appendChild(div);
          }
        })
        .catch(function(err) {
          listaBox.innerHTML = "<p style='font-size:12px; color:#cbd5e0;'>Sincronización de bitácoras lista. Registra a la primera Voz para activar el panel dinámico.</p>";
        });
    }

    function dispararWhatsAppClonado(index) {
      var item = globalRegistros[index];
      if (!item || !item.w || item.w === "-") { alert("Número inválido."); return; }
      
      var template = (item.tipo === "Invitado Nuevo") ? pAsistente : pStaff;
      
      if (!template) {
        template = "¡Hola *{NOMBRE}*! 🌀 Confirmamos tu registro para el próximo encuentro del Coro Jeyajé Arco Iris. 📍 Lugar: Maloca Central, Km 12 doble vía a La Guardia. ✨ Condición: {CONDICION}. ¡Tu voz expande el rezo!";
      }
      
      var textoFinal = template.replace(/{NOMBRE}/g, item.n)
                                .replace(/{CONDICION}/g, item.tipo);
      
      var urlWa = "https://whatsapp.com" + item.w.toString().trim() + "&text=" + encodeURIComponent(textoFinal);
      window.open(urlWa, '_blank');
    }
  </script>
</body>
</html>
